<!DOCTYPE html><html lang="ja"><head><base target="_top"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>
:root{--g:#287153;--d:#174b38;--p:#edf8f2;--i:#24342d;--m:#68766f;--l:#d7e4dc;--r:#a42b24}*{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#edf8f2,#fffaf0);color:var(--i);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;line-height:1.5}.wrap{width:min(680px,calc(100% - 20px));margin:auto;padding:12px 0 42px}.hero{padding:22px 20px;border-radius:20px 20px 8px 8px;color:#fff;background:linear-gradient(125deg,var(--d),var(--g));box-shadow:0 10px 28px #184c3825}.hero h1{margin:0;font-size:clamp(24px,7vw,35px)}.hero p{margin:5px 0 0;opacity:.9}.card{margin-top:13px;padding:21px 17px;border:1px solid var(--l);border-radius:16px;background:#fffffff5;box-shadow:0 6px 20px #244c3810}.card h2{margin:0 0 15px;font-size:23px}label{display:block;margin:13px 0 6px;font-size:17px;font-weight:700}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}select,input{width:100%;min-height:56px;padding:11px 13px;border:1px solid #b7c9bf;border-radius:12px;background:#fff;font:inherit;font-size:17px}button{width:100%;min-height:61px;margin-top:17px;padding:13px;border:0;border-radius:13px;background:var(--g);color:#fff;font:700 18px inherit;box-shadow:0 7px 18px #28715332}button.secondary{background:#fff;color:var(--g);border:1px solid var(--g);box-shadow:none}button:disabled{opacity:.55}.hidden{display:none!important}.camera-box{overflow:hidden;border-radius:14px;background:#111;aspect-ratio:3/4}video,.photo-preview{display:block;width:100%;height:100%;object-fit:cover}.capture{min-height:76px;border-radius:999px;font-size:22px}.shot-count{text-align:center;margin:10px 0 0;font-size:20px;font-weight:800;color:var(--g)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.mode-options{display:grid;grid-template-columns:1fr 1fr;gap:9px}.mode-option{display:flex;min-height:86px;margin:0;padding:12px;align-items:flex-start;gap:9px;border:2px solid var(--l);border-radius:12px;background:#fff;font-size:15px;font-weight:400}.mode-option:has(input:checked){border-color:var(--g);background:var(--p)}.mode-option input{width:21px;min-height:21px;margin:2px 0 0;padding:0;accent-color:var(--g)}.mode-option strong{display:block;font-size:17px}.review-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.review-item{position:relative;overflow:hidden;border-radius:12px;background:#eef3f0;aspect-ratio:3/4}.review-item img{width:100%;height:100%;object-fit:cover}.review-item button{position:absolute;right:7px;top:7px;width:auto;min-height:42px;margin:0;padding:7px 11px;background:#fff;color:var(--r);border:1px solid #e2b0ad;border-radius:999px;font-size:14px;box-shadow:0 2px 8px #0004}.done{text-align:center}.check{display:flex;width:84px;height:84px;margin:4px auto 14px;align-items:center;justify-content:center;border-radius:50%;background:#dff3e8;color:var(--g);font-size:50px;font-weight:800}.saved-label{padding:14px;border-radius:11px;background:var(--p);font-size:18px;font-weight:700;white-space:pre-wrap}.queue{border:2px solid #e1ad38;background:#fffaf0}.queue strong{font-size:20px}.queue-count{margin-top:6px;color:#765800;font-weight:700}.network{display:inline-block;margin-left:8px;padding:2px 9px;border-radius:999px;background:#dff3e8;color:var(--g);font-size:12px}.network.offline{background:#fdecea;color:var(--r)}.status{position:sticky;bottom:8px;margin-top:13px;padding:14px;border-radius:10px;background:var(--p);color:var(--d);font-weight:700;box-shadow:0 4px 18px #0002}.status.error{background:#fdecea;color:#8b211b}.note{color:var(--m);font-size:12px}.spin{display:inline-block;width:20px;height:20px;margin-right:8px;border:3px solid #ffffff60;border-top-color:#fff;border-radius:50%;vertical-align:-4px;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
</style></head><body><main class="wrap"><header class="hero"><h1>お便り用撮影</h1><p>圏外でも撮りだめし、通信が戻るとまとめて保存します。</p></header>
<section class="card queue"><strong>端末に保存中：<span id="queueCount">0</span>枚</strong><span id="network" class="network">オンライン</span><div id="queueMessage" class="queue-count">未送信の写真はありません。</div><button id="uploadPending" class="secondary hidden">未送信の写真をまとめてアップロード</button></section>
<section id="setup" class="card"><h2>撮影する活動</h2><div class="row"><div><label for="year">西暦</label><select id="year"></select></div><div><label for="month">月</label><select id="month"></select></div></div><label for="room">クラス</label><select id="room"><option value="">選択してください</option></select><label for="activity">活動名</label><input id="activity" maxlength="80" placeholder="例：運動会練習"><label>撮影方法</label><div class="mode-options"><label class="mode-option"><input type="radio" name="shootMode" value="single" checked><span><strong>1枚ずつ</strong>撮影後に自動で送信</span></label><label class="mode-option"><input type="radio" name="shootMode" value="continuous"><span><strong>連続撮影</strong>最後にまとめて送信</span></label></div><button id="start">撮影を開始</button><p class="note">写真はまずこの端末内へ保存されます。連続撮影では、撮り終わるまでアップロードを開始しません。送信完了まではブラウザの履歴・データを消さないでください。</p></section>
<section id="camera" class="card hidden"><h2>写真を撮影</h2><div id="cameraBox" class="camera-box"><video id="video" autoplay muted playsinline></video></div><div id="shotCount" class="shot-count hidden">撮影済み：0枚</div><button id="capture" class="capture">撮影</button><button id="cameraFallback" class="hidden">端末のカメラを開く</button><button id="finishShooting" class="secondary hidden">撮影を終えて写真を確認</button><input id="fallbackFile" class="hidden" type="file" accept="image/*" capture="environment"><button id="cancelCamera" class="secondary">撮影条件に戻る</button></section>
<section id="confirm" class="card hidden"><h2>この写真でよいですか？</h2><div class="camera-box"><img id="preview" class="photo-preview" alt="撮影した写真"></div><div class="actions"><button id="retake" class="secondary">撮り直す</button><button id="save">この写真を保存</button></div></section>
<section id="review" class="card hidden"><h2>撮影した写真を確認</h2><p>不要な写真は「削除」で外してから、まとめてアップロードしてください。</p><div id="reviewGrid" class="review-grid"></div><button id="reviewUpload">この写真をまとめてアップロード</button><button id="backToCamera" class="secondary">撮影に戻る</button></section>
<section id="complete" class="card done hidden"><div class="check">✓</div><h2 id="completeTitle">端末に保存しました</h2><div id="savedLabel" class="saved-label"></div><button id="continue">続けて撮影</button><button id="completeUpload" class="secondary hidden">撮影を終えてまとめてアップロード</button><button id="change" class="secondary">撮影条件を変更</button></section><div id="status" class="status hidden" role="status"></div><canvas id="canvas" class="hidden"></canvas></main><script>
const GAS_ENDPOINT='https://script.google.com/macros/s/AKfycbxYZxxC35l8yOZNHZfdBnwFI28xXUORGqLcr8uDEyIRjgE4vFF5pT3jIam1o4dJvyQS/exec',IN_GAS=!!(window.google&&window.google.script&&window.google.script.run),state={stream:null,imageData:'',saving:false,syncing:false,condition:null,db:null,mode:'single',batchCount:0,batchIds:[],holdUploads:false},$=id=>document.getElementById(id);function showPanel(id){['setup','camera','confirm','review','complete'].forEach(x=>$(x).classList.toggle('hidden',x!==id));window.scrollTo({top:0,behavior:'smooth'})}function status(m,error){$('status').textContent=m;$('status').className='status'+(error?' error':'')}function clearStatus(){$('status').className='status hidden'}function fail(e){status(e&&e.message?e.message:'処理に失敗しました。',true)}function uuid(){return(Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)+'-'+Math.random().toString(36).slice(2))}
function openQueue(){return new Promise((resolve,reject)=>{const q=indexedDB.open('kashiwa-camera',1);q.onupgradeneeded=()=>q.result.createObjectStore('uploads',{keyPath:'uploadId'});q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}function queueStore(mode){return state.db.transaction('uploads',mode).objectStore('uploads')}function queuePut(v){return new Promise((resolve,reject)=>{const q=queueStore('readwrite').put(v);q.onsuccess=()=>resolve();q.onerror=()=>reject(q.error)})}function queueDelete(id){return new Promise((resolve,reject)=>{const q=queueStore('readwrite').delete(id);q.onsuccess=()=>resolve();q.onerror=()=>reject(q.error)})}function queueAll(){return new Promise((resolve,reject)=>{const q=queueStore('readonly').getAll();q.onsuccess=()=>resolve(q.result.sort((a,b)=>a.createdAt-b.createdAt));q.onerror=()=>reject(q.error)})}
async function refreshQueue(){if(!state.db)return;const items=await queueAll(),n=items.length;$('queueCount').textContent=n;$('queueMessage').textContent=n?n+'枚が端末に安全に保存されています。'+(state.holdUploads?'撮影後にまとめてアップロードできます。':'通信可能になると自動送信します。'):'未送信の写真はありません。';$('uploadPending').classList.toggle('hidden',!n);$('network').textContent=navigator.onLine?'オンライン':'オフライン';$('network').classList.toggle('offline',!navigator.onLine)}
function jsonp(params){return new Promise((resolve,reject)=>{const cb='cameraCb_'+uuid().replace(/-/g,'_'),script=document.createElement('script'),timer=setTimeout(()=>finish(new Error('サーバーから応答がありません。')),15000);function finish(error,value){clearTimeout(timer);delete window[cb];script.remove();error?reject(error):resolve(value)}window[cb]=value=>finish(null,value);script.onerror=()=>finish(new Error('サーバーへ接続できません。'));script.src=GAS_ENDPOINT+'?'+new URLSearchParams(Object.assign({},params,{callback:cb}));document.head.appendChild(script)})}
function standaloneUpload(item){return new Promise((resolve,reject)=>{const frameName='cameraUpload_'+uuid().replace(/-/g,'_'),frame=document.createElement('iframe'),form=document.createElement('form'),action=document.createElement('input'),payload=document.createElement('input');frame.name=frameName;frame.className='hidden';form.method='post';form.action=GAS_ENDPOINT;form.target=frameName;action.name='action';action.value='cameraUpload';payload.name='payload';payload.value=JSON.stringify(item);form.append(action,payload);document.body.append(frame,form);form.submit();form.remove();let attempts=0;const poll=async()=>{try{const result=await jsonp({action:'cameraUploadStatus',uploadId:item.uploadId});if(result.state==='done'){frame.remove();return resolve(result.result)}if(result.state==='error'){frame.remove();return reject(new Error(result.error))}}catch(e){}if(++attempts>=60){frame.remove();return reject(new Error('アップロード結果を確認できませんでした。写真は端末に残っています。'))}setTimeout(poll,1000)};setTimeout(poll,1000)})}
function serverUpload(item){return IN_GAS?new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).uploadActivityPhoto(item)):standaloneUpload(item)}async function syncPending(manual){if(state.syncing||!state.db||!navigator.onLine||state.holdUploads&&!manual)return 0;const items=await queueAll();if(!items.length){await refreshQueue();return 0}state.syncing=true;$('uploadPending').disabled=true;$('completeUpload').disabled=true;$('uploadPending').innerHTML='<i class="spin dark"></i>アップロード中…';$('completeUpload').innerHTML='<i class="spin dark"></i>まとめてアップロード中…';let sent=0,failed=false;try{for(const item of items){try{await serverUpload(item);await queueDelete(item.uploadId);sent++;await refreshQueue()}catch(e){failed=true;if(manual)fail(e);break}}if(sent&&!failed)status(sent+'枚をGoogle Driveと記録シートへ保存しました。');return sent}finally{state.syncing=false;$('uploadPending').disabled=false;$('completeUpload').disabled=false;$('uploadPending').textContent='未送信の写真をまとめてアップロード';$('completeUpload').textContent='撮影を終えてまとめてアップロード';await refreshQueue()}}
function populateInitial(d){localStorage.setItem('cameraInitialData',JSON.stringify(d));d.years.forEach(v=>$('year').add(new Option(v+'年',v)));d.months.forEach(v=>$('month').add(new Option(v+'月',v)));d.rooms.forEach(v=>$('room').add(new Option(v,v)));$('year').value=d.currentYear;$('month').value=d.currentMonth;clearStatus()}
openQueue().then(db=>{state.db=db;refreshQueue();syncPending(false)}).catch(()=>status('端末内の保存領域を使用できません。ブラウザ設定を確認してください。',true));const cached=localStorage.getItem('cameraInitialData');if(cached){try{populateInitial(JSON.parse(cached))}catch(e){}}if(IN_GAS)google.script.run.withSuccessHandler(d=>{if(!$('year').options.length)populateInitial(d);else localStorage.setItem('cameraInitialData',JSON.stringify(d))}).withFailureHandler(e=>{if(!$('year').options.length)fail(e)}).getCameraInitialData();else jsonp({action:'cameraInitial'}).then(d=>{if(!$('year').options.length)populateInitial(d);else localStorage.setItem('cameraInitialData',JSON.stringify(d))}).catch(e=>{if(!$('year').options.length)fail(e)});
function condition(){const v={year:Number($('year').value),month:Number($('month').value),room:$('room').value,activity:$('activity').value.trim()};if(!v.year||!v.month)return status('西暦と月を選択してください。',true);if(!v.room)return status('クラスを選択してください。',true);if(!v.activity)return status('活動名を入力してください。',true);return v}
function openDeviceCamera(){const c=condition();if(!c)return;state.condition=c;clearStatus();stopCamera();releaseImage();$('fallbackFile').click()}
function nativeCameraView(){stopCamera();$('cameraBox').classList.add('hidden');$('capture').classList.add('hidden');$('cameraFallback').classList.remove('hidden');$('cameraFallback').textContent=state.batchCount?'次の写真を撮影':'端末のカメラを開く';showPanel('camera')}
function inlineCameraView(){$('cameraBox').classList.remove('hidden');$('capture').classList.remove('hidden');$('cameraFallback').classList.add('hidden')}
function isIOS(){return IN_GAS&&(/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1))}
async function startCamera(){const c=condition();if(!c)return;state.condition=c;clearStatus();stopCamera();inlineCameraView();try{if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('camera unavailable');state.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1440}},audio:false});const video=$('video');video.srcObject=state.stream;video.muted=true;video.setAttribute('playsinline','');await video.play();showPanel('camera')}catch(e){nativeCameraView();status('この画面内ではカメラを使用できません。下のボタンから端末のカメラを開いてください。',true)}}function stopCamera(){if(state.stream){state.stream.getTracks().forEach(t=>t.stop());state.stream=null}$('video').srcObject=null}
function makeImage(source,w,h,confirm){const max=1920,scale=Math.min(1,max/Math.max(w,h)),canvas=$('canvas');canvas.width=Math.max(1,Math.round(w*scale));canvas.height=Math.max(1,Math.round(h*scale));canvas.getContext('2d').drawImage(source,0,0,canvas.width,canvas.height);state.imageData=canvas.toDataURL('image/jpeg',.88);if(confirm){$('preview').src=state.imageData;showPanel('confirm')}}
function queuedItem(){const c=state.condition,createdAt=Date.now();return{uploadId:uuid(),year:c.year,month:c.month,room:c.room,activity:c.activity,imageData:state.imageData,createdAt:createdAt,capturedAt:new Date(createdAt).toISOString()}}
async function saveContinuous(){if(state.saving||!state.imageData)return;state.saving=true;$('capture').disabled=true;try{if(!state.db)throw new Error('端末内の保存領域を準備できていません。少し待ってもう一度お試しください。');const item=queuedItem();await queuePut(item);state.batchIds.push(item.uploadId);state.batchCount=state.batchIds.length;$('shotCount').textContent='撮影済み：'+state.batchCount+'枚';$('capture').textContent='保存しました ✓';releaseImage();await refreshQueue();setTimeout(()=>{$('capture').textContent='撮影'},450)}catch(e){fail(e)}finally{state.saving=false;$('capture').disabled=false}}
async function renderReview(){stopCamera();releaseImage();const items=await queueAll(),batch=items.filter(v=>state.batchIds.indexOf(v.uploadId)>=0),grid=$('reviewGrid');grid.innerHTML='';state.batchCount=batch.length;if(!batch.length){status('確認する写真がありません。',true);return showPanel('setup')}batch.forEach((item,index)=>{const box=document.createElement('div');box.className='review-item';const img=document.createElement('img');img.src=item.imageData;img.alt=(index+1)+'枚目';const remove=document.createElement('button');remove.type='button';remove.textContent='削除';remove.onclick=async()=>{await queueDelete(item.uploadId);state.batchIds=state.batchIds.filter(id=>id!==item.uploadId);await refreshQueue();renderReview()};box.append(img,remove);grid.appendChild(box)});$('reviewUpload').textContent=batch.length+'枚をまとめてアップロード';clearStatus();showPanel('review')}
$('start').onclick=()=>{state.mode=document.querySelector('input[name="shootMode"]:checked').value;state.batchCount=0;state.batchIds=[];state.holdUploads=state.mode==='continuous';$('shotCount').classList.toggle('hidden',state.mode!=='continuous');$('finishShooting').classList.toggle('hidden',state.mode!=='continuous');$('capture').textContent='撮影';if(state.mode==='continuous'&&isIOS()){nativeCameraView();openDeviceCamera()}else if(state.mode==='continuous')startCamera();else openDeviceCamera()};$('capture').onclick=async()=>{const v=$('video');if(!v.videoWidth)return status('カメラを準備できませんでした。端末のカメラを使用してください。',true);makeImage(v,v.videoWidth,v.videoHeight,state.mode!=='continuous');if(state.mode==='continuous')await saveContinuous()};$('retake').onclick=openDeviceCamera;$('finishShooting').onclick=renderReview;$('cancelCamera').onclick=()=>{if(state.mode==='continuous'&&state.batchCount)return renderReview();stopCamera();releaseImage();showPanel('setup')};$('cameraFallback').onclick=openDeviceCamera;$('fallbackFile').onchange=e=>{const file=e.target.files&&e.target.files[0];e.target.value='';if(!file)return;status('写真を読み込んでいます…');const reader=new FileReader();reader.onerror=()=>status('写真を読み込めませんでした。',true);reader.onload=()=>{const img=new Image();img.onerror=()=>status('写真を読み込めませんでした。',true);img.onload=async()=>{clearStatus();makeImage(img,img.naturalWidth,img.naturalHeight,state.mode!=='continuous');if(state.mode==='continuous'){await saveContinuous();nativeCameraView()}};img.src=reader.result};reader.readAsDataURL(file);if(state.mode==='continuous'&&isIOS())$('fallbackFile').click()};
function releaseImage(){state.imageData='';$('preview').removeAttribute('src');const c=$('canvas');c.width=1;c.height=1}
$('save').onclick=async()=>{if(state.saving||!state.imageData||!state.condition)return;state.saving=true;$('save').disabled=true;$('retake').disabled=true;$('save').innerHTML='<i class="spin"></i>端末に保存中…';clearStatus();const c=state.condition,item=queuedItem();try{if(!state.db)throw new Error('端末内の保存領域を準備できていません。少し待ってもう一度お試しください。');await queuePut(item);stopCamera();releaseImage();$('completeTitle').textContent=navigator.onLine?'端末に保存しました':'オフラインで保存しました';$('savedLabel').textContent=c.year+'年'+c.month+'月　'+c.room+'　'+c.activity+'\nアップロード待ち';$('completeUpload').classList.add('hidden');$('change').classList.remove('hidden');showPanel('complete');await refreshQueue();status(navigator.onLine?'端末に保存しました。続けて撮影できます。':'圏外のため端末に保存しました。通信が戻ると自動送信します。');syncPending(false)}catch(e){fail(e)}finally{state.saving=false;$('save').disabled=false;$('retake').disabled=false;$('save').textContent='この写真を保存'}};
$('reviewUpload').onclick=async()=>{if(!navigator.onLine)return status('オフラインです。写真は端末に保存されています。通信が戻ってから押してください。',true);state.holdUploads=false;$('reviewUpload').disabled=true;$('reviewUpload').innerHTML='<i class="spin"></i>まとめてアップロード中…';const sent=await syncPending(true),remaining=await queueAll(),batchRemaining=remaining.filter(v=>state.batchIds.indexOf(v.uploadId)>=0);$('reviewUpload').disabled=false;if(sent&&!batchRemaining.length){state.batchCount=0;state.batchIds=[];$('completeTitle').textContent='まとめて保存しました';$('savedLabel').textContent='撮影した写真をGoogle Driveへアップロードしました。';$('continue').textContent='さらに撮影する';$('completeUpload').classList.add('hidden');$('change').classList.remove('hidden');showPanel('complete')}else $('reviewUpload').textContent=Math.max(1,batchRemaining.length)+'枚をまとめてアップロード'};$('backToCamera').onclick=()=>{state.holdUploads=true;startCamera()};$('continue').onclick=()=>{if(state.mode==='continuous'){state.holdUploads=true;state.batchIds=[];state.batchCount=0;$('shotCount').textContent='撮影済み：0枚';$('continue').textContent='続けて撮影';startCamera()}else openDeviceCamera()};$('completeUpload').onclick=async()=>{if(!navigator.onLine)return status('オフラインです。写真は端末に保存されています。通信が戻ってから押してください。',true);state.holdUploads=false;const sent=await syncPending(true),remaining=await queueAll();if(sent&&!remaining.length){state.batchCount=0;$('completeTitle').textContent='まとめて保存しました';$('savedLabel').textContent='すべての写真をGoogle Driveへアップロードしました。';$('continue').textContent='さらに撮影する';$('completeUpload').classList.add('hidden');$('change').classList.remove('hidden')}};$('change').onclick=()=>{state.holdUploads=false;state.batchCount=0;state.batchIds=[];stopCamera();releaseImage();clearStatus();showPanel('setup');syncPending(false)};$('uploadPending').onclick=()=>{state.holdUploads=false;syncPending(true)};window.addEventListener('online',()=>{refreshQueue();syncPending(false)});window.addEventListener('offline',refreshQueue);window.addEventListener('pagehide',()=>{stopCamera();releaseImage()});
</script></body></html>
